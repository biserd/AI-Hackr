name: Firecrawl native stack
on:
  push:
    branches: [codex/firecrawl-native, main]
    paths: ['native/**', 'vendor/firecrawl', '.gitmodules', '.github/workflows/firecrawl-native.yml']
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: native-stack-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { submodules: recursive }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24', cache: npm, cache-dependency-path: native/package-lock.json }
      - name: Verify pins, test gateway and prepare upstream builds
        working-directory: native
        run: |
          npm ci --ignore-scripts
          npm run verify:source
          npm test
          node scripts/prepare-build.mjs
          node scripts/setup.mjs
          printf '%s\n' 'FORCED_ENGINE_DOMAINS={"example.com":"fetch","workers.dev":"playwright"}' >> .env
          docker compose config --quiet
      - name: Build and start actual Firecrawl stack
        working-directory: native
        run: docker compose up --build -d --wait --wait-timeout 360
      - name: Verify native SDK, browser, map, crawl, batch, MCP and rejection paths
        working-directory: native
        run: npm run test:stack
      - name: Replace containers while keeping durable volumes
        working-directory: native
        run: |
          docker compose down
          docker compose up -d --wait --wait-timeout 360
          npm run test:stack -- --restore
      - name: Collect redacted operational evidence
        if: always()
        working-directory: native
        run: |
          mkdir -p reports
          docker compose ps --all --format json > reports/containers.json
          docker compose logs --no-color --tail 120 api playwright-service nuq-postgres rabbitmq > reports/stack-logs.txt
          node scripts/redact-logs.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: firecrawl-native-evidence, path: native/reports, retention-days: 14 }
      - name: Stop isolated test stack
        if: always()
        working-directory: native
        run: docker compose down
