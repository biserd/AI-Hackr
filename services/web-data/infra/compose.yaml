name: aihackr-web-data
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: aihackr
      POSTGRES_USER: aihackr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U aihackr]
      interval: 5s
      retries: 10
  web-data:
    build: ..
    env_file: ../.env
    environment:
      DEV_FIXTURES: 'false'
      DATABASE_URL: postgres://aihackr:${POSTGRES_PASSWORD}@postgres:5432/aihackr
      BIND_HOST: 0.0.0.0
    ports: ['127.0.0.1:4100:4100']
    depends_on:
      postgres: {condition: service_healthy}
    networks: [private, egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped
networks:
  private: {internal: true}
  egress: {}
volumes:
  postgres: {}
