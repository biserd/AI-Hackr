<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Reviewer sign-in — AIHackr</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/oauth.css"><script type="module" src="/reviewer.mjs"></script></head>
<body class="oauth-page"><header><a class="brand" href="/">AIHackr</a></header><main class="oauth-card"><h1>Reviewer sign-in</h1><p>Use the dedicated review credentials supplied with the AIHackr plugin submission.</p><form id="reviewer-form"><label for="reviewer-email">Email</label><input id="reviewer-email" type="email" autocomplete="username" required><label for="reviewer-password">Password</label><input id="reviewer-password" type="password" autocomplete="current-password" required maxlength="128"><button id="reviewer-submit" class="button primary">Sign in →</button></form><p id="reviewer-error" role="alert" class="error-text"></p><p class="field-note">For your own AIHackr account, <a href="/dashboard">sign in with email</a>.</p></main></body>
</html>
