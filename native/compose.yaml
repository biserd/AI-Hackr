name: aihackr-native
x-logs: &logs
  driver: json-file
  options: { max-size: 10m, max-file: '3' }
services:
  gateway:
    build: { context: .., dockerfile: native/Dockerfile }
    restart: unless-stopped
    ports: ['127.0.0.1:8080:8080']
    environment:
      PORT: '8080'
      HOST: 0.0.0.0
      AIHACKR_API_KEY: ${AIHACKR_API_KEY:?Run node scripts/setup.mjs first}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      FIRECRAWL_API_URL: http://api:3002
      SEARCH_ENABLED: ${SEARCH_ENABLED:-false}
      EXTRACTION_ENABLED: ${EXTRACTION_ENABLED:-false}
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: ['CMD', node, '-e', 'fetch("http://127.0.0.1:8080/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 8s
      retries: 6
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    logging: *logs
    networks: [backend]

  api:
    build:
      context: ../vendor/firecrawl/apps/api
      dockerfile: ../../../../native/.build/api.Dockerfile
      args: { GIT_SHA: 7666c1f9ae8720a6bba271e0f60b6a217f8a5210 }
    restart: unless-stopped
    command: [node, dist/src/harness.js, --start-docker]
    environment:
      HOST: 0.0.0.0
      PORT: '3002'
      ENV: local
      USE_DB_AUTHENTICATION: 'false'
      REDIS_URL: redis://redis:6379
      REDIS_RATE_LIMIT_URL: redis://redis:6379
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup.mjs first}
      POSTGRES_HOST: nuq-postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: postgres
      NUQ_BACKEND: pg
      NUQ_RABBITMQ_URL: amqp://aihackr:${RABBITMQ_PASSWORD:?Run node scripts/setup.mjs first}@rabbitmq:5672
      PLAYWRIGHT_MICROSERVICE_URL: http://playwright-service:3000/scrape
      HARNESS_STARTUP_TIMEOUT_MS: '180000'
      NUM_WORKERS_PER_QUEUE: '1'
      CRAWL_CONCURRENT_REQUESTS: '2'
      MAX_CONCURRENT_JOBS: '2'
      BROWSER_POOL_SIZE: '2'
      ALLOW_LOCAL_WEBHOOKS: 'false'
      LOGGING_LEVEL: warn
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_EMBEDDING_NAME: ${MODEL_EMBEDDING_NAME:-}
      SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT:-}
      FORCED_ENGINE_DOMAINS: ${FORCED_ENGINE_DOMAINS:-}
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      nuq-postgres: { condition: service_healthy }
      playwright-service: { condition: service_started }
    healthcheck:
      test: ['CMD', node, '-e', 'fetch("http://127.0.0.1:3002/v0/health/readiness").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 120s
    mem_limit: 4g
    shm_size: 256m
    logging: *logs
    networks: [backend]

  playwright-service:
    build:
      context: ../vendor/firecrawl/apps/playwright-service-ts
      dockerfile: ../../../../native/.build/playwright.Dockerfile
      args: { PORT: '3000' }
    restart: unless-stopped
    environment:
      PORT: '3000'
      ALLOW_LOCAL_WEBHOOKS: 'false'
      BLOCK_MEDIA: 'true'
      MAX_CONCURRENT_PAGES: '2'
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 2g
    shm_size: 256m
    logging: *logs
    networks: [backend]

  redis:
    image: redis:8-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec]
    volumes: [redis-data:/data]
    healthcheck: { test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 12 }
    mem_limit: 256m
    logging: *logs
    networks: [backend]

  rabbitmq:
    image: rabbitmq:4-management@sha256:af6f50d38098d8bd52fef7f3fa85015dd8b2bf6def58e995bf584ae9ba0f6407
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: aihackr
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run node scripts/setup.mjs first}
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck: { test: [CMD, rabbitmq-diagnostics, -q, check_running], interval: 5s, timeout: 8s, retries: 18, start_period: 20s }
    mem_limit: 768m
    logging: *logs
    networks: [backend]

  nuq-postgres:
    build:
      context: ../vendor/firecrawl/apps/nuq-postgres
      dockerfile: ../../../../native/.build/postgres.Dockerfile
    restart: unless-stopped
    command: [postgres, -c, max_wal_size=512MB, -c, min_wal_size=64MB]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup.mjs first}
      POSTGRES_DB: postgres
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, 'pg_isready -U postgres -d postgres'], interval: 5s, timeout: 5s, retries: 18, start_period: 20s }
    mem_limit: 1g
    logging: *logs
    networks: [backend]

networks:
  backend: { driver: bridge }
volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
